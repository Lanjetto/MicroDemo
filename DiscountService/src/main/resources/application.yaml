server:
  port: 8082
spring:
  application:
    name: discount-service
  datasource:
    url: jdbc:postgresql://localhost:5432/discount_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
